<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('보호자')}"></head>
<body>
<header th:replace="~{fragments/layout :: header(${active})}"></header>
<main class="container">
  <div class="page-head">
    <h1>보호자</h1>
    <p>성(last name)으로 보호자를 찾아보세요.</p>
  </div>

  <form class="filter" th:action="@{/owners}" method="get" role="search">
    <label class="filter__field filter__field--grow">
      <span class="filter__label">성으로 시작하는 보호자</span>
      <input class="input" type="search" name="lastname" th:value="${lastname}"
             placeholder="예: Da (대소문자 구분 없음)" autocomplete="off">
    </label>
    <div class="filter__actions">
      <button class="btn" type="submit">검색</button>
      <a class="btn btn--ghost" th:href="@{/owners}" th:if="${!lastname.isEmpty()}">초기화</a>
    </div>
  </form>

  <div class="api-hint">
    <span class="chip chip--sky">GET</span>
    <code th:text="${lastname.isEmpty()} ? '/api/v1/owners' : '/api/v1/owners?lastname=' + ${lastname}">/api/v1/owners</code>
    <a th:href="${lastname.isEmpty()} ? @{/api/v1/owners} : @{/api/v1/owners(lastname=${lastname})}" target="_blank" rel="noopener">JSON 보기 ↗</a>
  </div>

  <h2 class="result-title">
    <span th:if="${lastname.isEmpty()}" th:text="${'전체 보호자 ' + owners.size() + '명'}">전체 보호자 10명</span>
    <span th:unless="${lastname.isEmpty()}" th:text="${'‘' + lastname + '’(으)로 시작하는 보호자 ' + owners.size() + '명'}">검색 결과</span>
  </h2>

  <div class="grid" th:if="${!owners.isEmpty()}">
    <th:block th:each="o : ${owners}"><a th:replace="~{fragments/cards :: owner(${o})}"></a></th:block>
  </div>
  <div class="empty" th:if="${owners.isEmpty()}">
    <span class="empty__icon">🧺</span>일치하는 보호자가 없어요. <br>API도 이 경우 빈 배열(<code>[]</code>)을 돌려줘요.
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
